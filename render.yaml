services:
  - type: web
    name: portfolio-api
    runtime: node
    rootDir: apps/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /var/data/portfolio.sqlite
      - key: UPLOAD_PATH
        value: /var/data/uploads
      - key: PUBLIC_API_URL
        value: https://portfolio-api.onrender.com
      - key: CLIENT_URL
        value: https://portfolio-site.onrender.com
      - key: CMS_URL
        value: https://portfolio-cms.onrender.com
      - key: CORS_ORIGINS
        value: https://portfolio-site.onrender.com,https://portfolio-cms.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: portfolio-site
    runtime: node
    rootDir: apps/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://portfolio-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://portfolio-site.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'

  - type: web
    name: portfolio-cms
    runtime: static
    rootDir: apps/cms
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: VITE_API_URL
        value: https://portfolio-api.onrender.com
      - key: VITE_PORTFOLIO_URL
        value: https://portfolio-site.onrender.com